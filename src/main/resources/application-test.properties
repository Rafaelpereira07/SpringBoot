# Profile used by @SpringBootTest / integration tests. Uses in-memory H2
# instead of MySQL so tests do not require external infrastructure.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=test-secret-key-not-for-production-use-only-32bytes
app.admin.api-key=test-admin-key

# Keep tests fast: disable the artificial latency.
app.artificial-delay.enabled=false
