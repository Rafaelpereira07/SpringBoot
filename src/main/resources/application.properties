spring.application.name=demo

server.port=3001

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/online_course?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Artificial delay in milliseconds to simulate slow responses
app.artificial-delay.enabled=true
app.artificial-delay.milliseconds=500
