spring.application.name=demo

server.port=${PORT:8080}

# --- Datasource (all sensitive values come from environment variables) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/online_course?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate must never auto-generate DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# --- Admin (professor) access ---
app.admin.api-key=${ADMIN_API_KEY:8bnf436219mff}

# --- Artificial network delay (see ArtificialDelayFilter) ---
app.artificial-delay.enabled=${ARTIFICIAL_DELAY_ENABLED:true}
app.artificial-delay.milliseconds=${ARTIFICIAL_DELAY_MS:500}

# --- Subscription plan pricing (kept out of code, see PlanPricingProperties) ---
app.plans.mensal.price=${PLAN_MENSAL_PRICE:29.90}
app.plans.anual.price=${PLAN_ANUAL_PRICE:249.90}
app.plans.vitalicio.price=${PLAN_VITALICIO_PRICE:699.90}

# --- OpenAPI ---
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs

# --- Certificates ---
app.certificates.storage-dir=${CERTIFICATES_DIR:./data/certificates}

server.error.include-message=always
server.error.include-binding-errors=always
